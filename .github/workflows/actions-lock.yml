name: actions-lock

# .github/workflows/actions.lock がワークフローの uses: と一致し、
# 各 pin が上流で検証できる (タグの付け替えや fork コミットでない) ことを確認する。
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      # 拡張のバージョンは renovate.json の customManager で更新する
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify actions.lock
        run: gh actions-lock --verify
